<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>CSIC體感全身動起來</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0d0f18;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    /* 遊戲主容器 */
    #game-container {
      position: relative;
      width: 960px;
      height: 600px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
      border: 2px solid #3f72af;
      background: #000;
    }
    /* 進入全螢幕時的滿版樣式 */
    #game-container:fullscreen {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      border: none;
    }
    #game-container:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      border: none;
    }
    video {
      display: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      /* 鏡像翻轉，確保動作符合鏡像直覺 */
      transform: scaleX(-1);
    }
    /* 頂部資訊 HUD */
    #ui-hud {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 25px;
      font-size: 20px;
      font-weight: bold;
      z-index: 15;
      background: rgba(15, 20, 35, 0.8);
      padding: 10px 28px;
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
    }
    /* 全螢幕手動切換按鈕 */
    #fullscreen-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 16;
      background: rgba(15, 20, 35, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: background 0.2s, transform 0.2s;
    }
    #fullscreen-btn:hover {
      background: #3f72af;
      transform: scale(1.08);
    }
    /* 遊戲結算與開頭遮罩 */
    #overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 12, 20, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      text-align: center;
      padding: 24px;
    }
    .guide-box {
      margin: 18px 0;
      text-align: left;
      font-size: 16px;
      line-height: 1.8;
      background: rgba(255, 255, 255, 0.08);
      padding: 16px 26px;
      border-radius: 12px;
      max-width: 500px;
    }
    button.action-btn {
      margin-top: 10px;
      padding: 14px 45px;
      font-size: 20px;
      font-weight: bold;
      background: #3f72af;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(63, 114, 175, 0.4);
      transition: transform 0.2s, background 0.2s;
    }
    button.action-btn:hover {
      background: #112d4e;
      transform: scale(1.05);
    }
  </style>

  <!-- MediaPipe Pose & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="game-container">
    <button id="fullscreen-btn" title="切換全螢幕">⛶</button>

    <div id="ui-hud">
      <div>分數: <span id="score-text" style="color: #00ffcc;">0</span></div>
      <div>倒數: <span id="timer-text" style="color: #ffbe0b;">60</span> 秒</div>
    </div>

    <video id="webcam" playsinline></video>
    <canvas id="output-canvas"></canvas>
    
    <div id="overlay-screen">
      <h1 id="screen-title" style="font-size: 38px;">全身體感頂球與避障</h1>
      <div class="guide-box">
        <p>⚽ <strong>綠色球 (+15 分)</strong>：用「頭部頂擊」或「雙手拍打」得分！</p>
        <p>💣 <strong>紅色炸彈 (-20 分)</strong>：左右橫移閃避身軀，請勿碰觸！</p>
        <p>🚀 點擊下方按鈕將<strong>自動全螢幕</strong>啟動，請退後約 2 公尺預備！</p>
      </div>
      <button id="start-btn" class="action-btn">開始挑戰</button>
    </div>
  </div>

  <script>
    const container = document.getElementById('game-container');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const scoreText = document.getElementById('score-text');
    const timerText = document.getElementById('timer-text');
    const overlayScreen = document.getElementById('overlay-screen');
    const startBtn = document.getElementById('start-btn');
    const screenTitle = document.getElementById('screen-title');

    let score = 0;
    let timeLeft = 60;
    let isPlaying = false;
    let timerInterval = null;
    let entities = [];
    let detectedPose = null;

    // 自適應調整畫布尺寸
    function resizeCanvas() {
      canvasElement.width = container.clientWidth;
      canvasElement.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 啟動全螢幕函式
    function enterFullScreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen().catch(err => {
            console.warn("全螢幕請求被限制或失敗:", err);
          });
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      }
    }

    // 全螢幕手動切換開關
    function toggleFullScreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        enterFullScreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }
    fullscreenBtn.addEventListener('click', toggleFullScreen);

    document.addEventListener('fullscreenchange', () => {
      resizeCanvas();
      fullscreenBtn.textContent = document.fullscreenElement ? '🗗' : '⛶';
    });

    // Web Audio 音效產生器
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playHitTone() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playExplodeTone() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    // 生成物件（得分球或炸彈）
    function spawnEntity() {
      const isBomb = Math.random() < 0.35;
      const radius = isBomb ? 26 : 30;
      entities.push({
        type: isBomb ? 'bomb' : 'ball',
        x: radius + Math.random() * (canvasElement.width - radius * 2),
        y: -35,
        speedY: 2.8 + Math.random() * 3.5,
        radius: radius,
        color: isBomb ? '#ff2a5f' : '#00f5d4'
      });
    }

    // 骨架連線關節對應
    const POSE_CONNECTIONS = [
      [11, 12], [11, 13], [13, 15],
      [12, 14], [14, 16], [11, 23],
      [12, 24], [23, 24]
    ];

    function drawSkeleton(landmarks) {
      canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      canvasCtx.lineWidth = 3;
      
      for (let [p1, p2] of POSE_CONNECTIONS) {
        const ptA = landmarks[p1];
        const ptB = landmarks[p2];
        if (ptA && ptB && ptA.visibility > 0.5 && ptB.visibility > 0.5) {
          canvasCtx.beginPath();
          canvasCtx.moveTo(ptA.x * canvasElement.width, ptA.y * canvasElement.height);
          canvasCtx.lineTo(ptB.x * canvasElement.width, ptB.y * canvasElement.height);
          canvasCtx.stroke();
        }
      }

      // 頭部與手部光圈標記
      [0, 15, 16].forEach(idx => {
        const pt = landmarks[idx];
        if (pt && pt.visibility > 0.5) {
          canvasCtx.beginPath();
          canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, idx === 0 ? 25 : 18, 0, 2 * Math.PI);
          canvasCtx.fillStyle = idx === 0 ? 'rgba(255, 215, 0, 0.5)' : 'rgba(0, 245, 212, 0.6)';
          canvasCtx.fill();
        }
      });
    }

    // 主動畫更新循環
    function renderLoop() {
      canvasCtx.save();
      canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

      if (detectedPose && detectedPose.poseLandmarks) {
        drawSkeleton(detectedPose.poseLandmarks);
      }

      if (isPlaying) {
        if (entities.length < 5 && Math.random() < 0.04) {
          spawnEntity();
        }

        const landmarks = detectedPose?.poseLandmarks;

        for (let i = entities.length - 1; i >= 0; i--) {
          const e = entities[i];
          e.y += e.speedY;

          canvasCtx.beginPath();
          canvasCtx.arc(e.x, e.y, e.radius, 0, 2 * Math.PI);
          canvasCtx.fillStyle = e.color;
          canvasCtx.shadowColor = e.color;
          canvasCtx.shadowBlur = 12;
          canvasCtx.fill();
          canvasCtx.shadowBlur = 0;

          let hit = false;

          if (landmarks) {
            // 接球：頭部 (0)、雙手腕 (15, 16)
            // 傷害：頭部、雙肩 (11, 12)、骨盆 (23, 24)
            const checkPoints = e.type === 'ball'
              ? [{ idx: 0, rad: 30 }, { idx: 15, rad: 22 }, { idx: 16, rad: 22 }]
              : [{ idx: 0, rad: 30 }, { idx: 11, rad: 25 }, { idx: 12, rad: 25 }, { idx: 23, rad: 25 }, { idx: 24, rad: 25 }];

            for (let check of checkPoints) {
              const lm = landmarks[check.idx];
              if (lm && lm.visibility > 0.5) {
                const lx = lm.x * canvasElement.width;
                const ly = lm.y * canvasElement.height;
                if (Math.hypot(lx - e.x, ly - e.y) < e.radius + check.rad) {
                  hit = true;
                  break;
                }
              }
            }
          }

          if (hit) {
            if (e.type === 'ball') {
              playHitTone();
              score += 15;
            } else {
              playExplodeTone();
              score = Math.max(0, score - 20);
            }
            scoreText.textContent = score;
            entities.splice(i, 1);
            continue;
          }

          if (e.y > canvasElement.height + 40) {
            entities.splice(i, 1);
          }
        }
      }

      canvasCtx.restore();
      requestAnimationFrame(renderLoop);
    }

    // MediaPipe Pose 初始化
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    pose.onResults((results) => {
      detectedPose = results;
    });

    // 啟動相機
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start();
    requestAnimationFrame(renderLoop);

    // 遊戲進程控制：點擊時自動執行全螢幕
    function startGame() {
      // 1. 自動觸發全螢幕
      enterFullScreen();

      // 2. 喚醒音效引擎
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      // 3. 狀態重置
      score = 0;
      timeLeft = 60;
      entities = [];
      scoreText.textContent = score;
      timerText.textContent = timeLeft;
      isPlaying = true;
      overlayScreen.style.display = 'none';

      // 延遲微調確保留出全螢幕過渡動畫時間重新校正畫布
      setTimeout(resizeCanvas, 150);

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerText.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);
      screenTitle.textContent = "挑戰結束！";
      startBtn.textContent = "再挑戰一次";
      overlayScreen.style.display = 'flex';
    }

    // 綁定按鈕點擊觸發全螢幕
    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
