<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>體感拍拍樂 - AR 體感小遊戲</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #1a1a2e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #ui-container {
      position: absolute;
      top: 20px;
      display: flex;
      gap: 30px;
      font-size: 24px;
      font-weight: bold;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 30px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .game-box {
      position: relative;
      width: 960px;
      height: 540px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #e94560;
    }
    video {
      display: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      /* 鏡像翻轉，符合鏡子直覺 */
      transform: scaleX(-1);
    }
    #overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 15, 26, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    button {
      margin-top: 20px;
      padding: 14px 40px;
      font-size: 20px;
      font-weight: bold;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    button:hover {
      background: #ff5773;
      transform: scale(1.05);
    }
  </style>

  <!-- MediaPipe Hands & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="ui-container">
    <div>分數: <span id="score-text" style="color: #4ecca3;">0</span></div>
    <div>倒數: <span id="timer-text" style="color: #ffd369;">60</span> 秒</div>
  </div>

  <div class="game-box">
    <video id="webcam" playsinline></video>
    <canvas id="output-canvas" width="960" height="540"></canvas>
    
    <div id="overlay-screen">
      <h1 id="screen-title" style="font-size: 40px; margin-bottom: 10px;">體感拍彩球</h1>
      <p id="screen-desc" style="color: #ccc; font-size: 18px;">請對準鏡頭，揮動手掌拍擊畫面上的彩色圓點！</p>
      <button id="start-btn">開始遊戲</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const scoreText = document.getElementById('score-text');
    const timerText = document.getElementById('timer-text');
    const overlayScreen = document.getElementById('overlay-screen');
    const startBtn = document.getElementById('start-btn');
    const screenTitle = document.getElementById('screen-title');
    const screenDesc = document.getElementById('screen-desc');

    let score = 0;
    let timeLeft = 60;
    let isPlaying = false;
    let timerInterval = null;
    let targets = [];
    let detectedHands = [];

    // 音效合成（免載入外部音檔）
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playHitTone() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    // 隨機產生圓點
    const COLORS = ['#FF4757', '#2ED573', '#1E90FF', '#FFA502', '#9B59B6'];
    function spawnTarget() {
      const radius = 28 + Math.random() * 12;
      targets.push({
        x: radius + Math.random() * (canvasElement.width - radius * 2),
        y: radius + Math.random() * (canvasElement.height - radius * 2),
        radius: radius,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        life: 240 // 存活幀數
      });
    }

    // 核心循環與判定
    function renderLoop() {
      canvasCtx.save();
      // 繪製攝影機影像背景
      canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

      if (isPlaying) {
        // 定期產生圓點（保持場上 3-5 個）
        if (targets.length < 4 && Math.random() < 0.05) {
          spawnTarget();
        }

        // 碰撞檢查與更新
        for (let i = targets.length - 1; i >= 0; i--) {
          const t = targets[i];
          t.life--;

          // 繪製目標光暈與球體
          canvasCtx.beginPath();
          canvasCtx.arc(t.x, t.y, t.radius, 0, 2 * Math.PI);
          canvasCtx.fillStyle = t.color;
          canvasCtx.shadowColor = t.color;
          canvasCtx.shadowBlur = 15;
          canvasCtx.fill();
          canvasCtx.shadowBlur = 0;

          // 偵測手部關鍵點碰撞（包含食指尖、手掌中心等）
          let hit = false;
          detectedHands.forEach(hand => {
            // 7: 食指關節, 8: 食指尖, 9: 中指關節, 12: 中指尖, 0: 手腕
            const checkPoints = [0, 8, 9, 12];
            for (let ptIdx of checkPoints) {
              const pt = hand[ptIdx];
              const hx = pt.x * canvasElement.width;
              const hy = pt.y * canvasElement.height;
              const dist = Math.hypot(hx - t.x, hy - t.y);

              if (dist < t.radius + 15) {
                hit = true;
                break;
              }
            }
          });

          if (hit) {
            playHitTone();
            score += 10;
            scoreText.textContent = score;
            targets.splice(i, 1);
            continue;
          }

          if (t.life <= 0) {
            targets.splice(i, 1);
          }
        }

        // 視覺化標記手部位置（輔助玩家掌握座標）
        detectedHands.forEach(hand => {
          [8, 12].forEach(idx => {
            const tip = hand[idx];
            canvasCtx.beginPath();
            canvasCtx.arc(tip.x * canvasElement.width, tip.y * canvasElement.height, 10, 0, 2 * Math.PI);
            canvasCtx.fillStyle = '#00F2FE';
            canvasCtx.fill();
          });
        });
      }

      canvasCtx.restore();
      requestAnimationFrame(renderLoop);
    }

    // MediaPipe Hands 初始化設定
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      detectedHands = results.multiHandLandmarks || [];
    });

    // 啟動相機
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 960,
      height: 540
    });

    camera.start();
    requestAnimationFrame(renderLoop);

    // 流程控制
    function startGame() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      score = 0;
      timeLeft = 60;
      targets = [];
      scoreText.textContent = score;
      timerText.textContent = timeLeft;
      isPlaying = true;
      overlayScreen.style.display = 'none';

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerText.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);
      screenTitle.textContent = "時間到！";
      screenDesc.innerHTML = `你的最終得分為：<strong style="color: #4ecca3; font-size: 26px;">${score}</strong> 分`;
      startBtn.textContent = "再玩一次";
      overlayScreen.style.display = 'flex';
    }

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
